spring:
  application:
    name: batch-migration
  config:
    import: "optional:classpath:batch-config.properties"
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3307/dotations_db?useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:devuser}
    password: ${DB_PASSWORD:dev159357}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: true
  jpa:
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect
          show_sql: true
          format_sql: true
          hbm2ddl:
            auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
hibernate:
  dialect: org.hibernate.dialect.MySQLDialect
  show_sql: true
  format_sql: true
  hbm2ddl:
  auto: none

# Configuration cryptographique
crypto:
  transformation: ${CRYPTO_TRANSFORMATION:AES/GCM/NoPadding}
  key-environment-variable: APP_CRYPTO_KEY
  iv-length: ${CRYPTO_IV_LENGTH:12}
  tag-length: ${CRYPTO_TAG_LENGTH:128}
  format-version: v1

# Configuration migration
batch:
  input-file: classpath:data/person.csv
  chunk-size: ${BATCH_CHUNK_SIZE:500}
  grid-size: ${BATCH_GRID_SIZE:8}
  skip-limit: ${BATCH_SKIP_LIMIT:100}
  throttle-limit: 8
  retry-limit: 3



logging:
  level:
    root: INFO
    com.example.batch: INFO